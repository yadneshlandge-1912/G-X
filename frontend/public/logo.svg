<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Shield body -->
  <path d="M32 4 L56 14 L56 34 C56 47 44 57 32 61 C20 57 8 47 8 34 L8 14 Z"
        fill="url(#shieldGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Inner shield highlight -->
  <path d="M32 9 L52 18 L52 34 C52 45 42 53 32 57 C22 53 12 45 12 34 L12 18 Z"
        fill="url(#innerGrad)" opacity="0.4"/>

  <!-- LoRa radio wave arcs — centred on bottom dot -->
  <circle cx="32" cy="40" r="2.5" fill="#F59E0B"/>

  <!-- Arc 1 — small -->
  <path d="M26 36 Q32 30 38 36"
        stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Arc 2 — medium -->
  <path d="M21 31 Q32 22 43 31"
        stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.65"/>

  <!-- Arc 3 — large -->
  <path d="M16 26 Q32 14 48 26"
        stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.35"/>

  <!-- G letter mark bottom-left of shield (subtle) -->

  <!-- Gradients -->
  <defs>
    <linearGradient id="shieldGrad" x1="32" y1="4" x2="32" y2="61" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="8" y1="4" x2="56" y2="61" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="32" y1="9" x2="32" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
